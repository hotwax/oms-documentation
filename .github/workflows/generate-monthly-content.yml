name: Generate Monthly Content

on:
  schedule:
    - cron: "15 1 1 * *"
  workflow_dispatch:
    inputs:
      month:
        description: "Target month in YYYY-MM format"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve base branch
        id: base
        run: |
          BASE_BRANCH="${{ vars.AUTOMATION_BASE_BRANCH }}"
          if [ -z "$BASE_BRANCH" ]; then
            BASE_BRANCH="multi-agent-product-update-pub"
          fi
          echo "base_branch=$BASE_BRANCH" >> "$GITHUB_OUTPUT"

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.base.outputs.base_branch }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve source repos
        id: source-repos
        run: |
          SOURCE_REPOS="${{ vars.SOURCE_REPOS }}"
          if [ -z "$SOURCE_REPOS" ]; then
            SOURCE_REPOS="hotwax/receiving,hotwax/bopis,hotwax/fulfillment,hotwax/inventory-count,hotwax/transfers,hotwax/facilities,hotwax/preorder,hotwax/job-manager,hotwax/hotwax-maarg-util,hotwax/mantle-shopify-connector,hotwax/oms,hotwax/dxp-components,hotwax/hotwax-shopify-oms-bridge,hotwax/hotwax-oms,hotwax/hotwax-poorti,hotwax/hotwax-ofbiz-oms-usl,hotwax/mantle-netsuite-connector,hotwax/hotwax-unigate,hotwax/OrderRouting"
          fi
          echo "source_repos=$SOURCE_REPOS" >> "$GITHUB_OUTPUT"

      - name: Resolve target month and branch
        id: meta
        run: |
          TARGET_MONTH="${{ inputs.month }}"
          if [ -z "$TARGET_MONTH" ]; then
            TARGET_MONTH="$(node scripts/get_target_month.js)"
          fi
          BRANCH_PREFIX="$(node -e "console.log(JSON.parse(require('fs').readFileSync('config/publishing.json', 'utf8')).automation.monthlyBranchPrefix)")"
          echo "target_month=$TARGET_MONTH" >> "$GITHUB_OUTPUT"
          echo "branch_name=${BRANCH_PREFIX}-${TARGET_MONTH}" >> "$GITHUB_OUTPUT"

      - name: Generate monthly drafts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SOURCE_REPOS: ${{ steps.source-repos.outputs.source_repos }}
          PRODUCTION: "true"
          MONTH: ${{ steps.meta.outputs.target_month }}
          GENERATION_MODE: "monthly"
        run: npm run generate:monthly

      - name: Validate publish manifest
        env:
          MONTH: ${{ steps.meta.outputs.target_month }}
        run: |
          npm run validate:manifest
          npm run validate:state

      - name: Create or update review PR
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: ${{ steps.base.outputs.base_branch }}
          branch: ${{ steps.meta.outputs.branch_name }}
          commit-message: "docs(release): monthly content for ${{ steps.meta.outputs.target_month }}"
          title: "docs(release): monthly content for ${{ steps.meta.outputs.target_month }}"
          body: |
            Generated monthly release notes and product updates for `${{ steps.meta.outputs.target_month }}`.

            Included artifacts:
            - `drafts/${{ steps.meta.outputs.target_month }}/release-notes.md`
            - `drafts/${{ steps.meta.outputs.target_month }}/product-updates/*`
            - `drafts/${{ steps.meta.outputs.target_month }}/publish-manifest.json`
            - `state/hubspot-sync-state.json`
          labels: |
            automation
            monthly-content
          draft: true
          assignees: dt2patel
