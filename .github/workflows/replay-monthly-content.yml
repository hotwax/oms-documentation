name: Replay Monthly Content

on:
  workflow_dispatch:
    inputs:
      month:
        description: "Target month in YYYY-MM format"
        required: true
        type: string
      reason:
        description: "Reason for replay"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve base branch
        id: base
        run: |
          BASE_BRANCH="${{ vars.AUTOMATION_BASE_BRANCH }}"
          if [ -z "$BASE_BRANCH" ]; then
            BASE_BRANCH="multi-agent-product-update-pub"
          fi
          echo "base_branch=$BASE_BRANCH" >> "$GITHUB_OUTPUT"

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.base.outputs.base_branch }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve source repos
        id: source-repos
        run: |
          SOURCE_REPOS="${{ vars.SOURCE_REPOS }}"
          if [ -z "$SOURCE_REPOS" ]; then
            SOURCE_REPOS="hotwax/receiving,hotwax/bopis,hotwax/fulfillment,hotwax/inventory-count,hotwax/transfers,hotwax/facilities,hotwax/preorder,hotwax/oms"
          fi
          echo "source_repos=$SOURCE_REPOS" >> "$GITHUB_OUTPUT"

      - name: Resolve replay branch
        id: meta
        run: |
          BRANCH_PREFIX="$(node -e "console.log(JSON.parse(require('fs').readFileSync('config/publishing.json', 'utf8')).automation.replayBranchPrefix)")"
          echo "branch_name=${BRANCH_PREFIX}-${{ inputs.month }}" >> "$GITHUB_OUTPUT"

      - name: Regenerate month in replay mode
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SOURCE_REPOS: ${{ steps.source-repos.outputs.source_repos }}
          PRODUCTION: "true"
          MONTH: ${{ inputs.month }}
          GENERATION_MODE: "replay"
          REPLAY_REASON: ${{ inputs.reason }}
        run: npm run generate:monthly

      - name: Validate replay manifest and state
        env:
          MONTH: ${{ inputs.month }}
        run: |
          npm run validate:manifest
          npm run validate:state

      - name: Create or update replay PR
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: ${{ steps.base.outputs.base_branch }}
          branch: ${{ steps.meta.outputs.branch_name }}
          commit-message: "docs(replay): regenerate monthly content for ${{ inputs.month }}"
          title: "docs(replay): regenerate monthly content for ${{ inputs.month }}"
          body: |
            Regenerated monthly content for `${{ inputs.month }}` in replay mode.

            Replay reason:
            `${{ inputs.reason }}`

            Included artifacts:
            - `drafts/${{ inputs.month }}/release-notes.md`
            - `drafts/${{ inputs.month }}/product-updates/*`
            - `drafts/${{ inputs.month }}/publish-manifest.json`
            - `state/hubspot-sync-state.json`
          labels: |
            automation
            replay
          draft: true
          assignees: dt2patel
