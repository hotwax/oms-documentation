name: 🕸️ Sync GraphQL schema reference

# Regenerates documents/integrate-with-hotwax/api/graphql/schema-reference.md from the SDL an
# OMS instance publishes at GET /rest/s1/graphql/sdl, and opens a PR when it has changed.
# The SDL endpoint needs no authentication, so this job needs no secrets.

on:
  schedule:
    - cron: '0 4 * * 1'   # Mondays, 04:00 UTC
  workflow_dispatch:
    inputs:
      instance:
        description: 'OMS instance base URL to read the schema from'
        required: false
        default: 'https://dev-maarg.hotwax.io'

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout docs
        uses: actions/checkout@v4

      - name: 🟢 Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Install generator dependencies
        working-directory: src/graphql
        run: npm install --no-audit --no-fund

      - name: 🔍 Check the SDL endpoint is reachable
        id: probe
        env:
          INSTANCE: ${{ github.event.inputs.instance || 'https://dev-maarg.hotwax.io' }}
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$INSTANCE/rest/s1/graphql/sdl")
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" != "200" ]; then
            echo "::warning::$INSTANCE/rest/s1/graphql/sdl returned $status."
            echo "A 404 means the moqui-gql component is not loaded on that instance."
            echo "Skipping regeneration; the committed reference is left untouched."
          fi

      - name: 🛠 Regenerate the schema reference
        if: steps.probe.outputs.status == '200'
        env:
          INSTANCE: ${{ github.event.inputs.instance || 'https://dev-maarg.hotwax.io' }}
        run: node src/graphql/generate-schema-reference.mjs --instance "$INSTANCE"

      - name: 📤 Open a pull request if the schema changed
        if: steps.probe.outputs.status == '200'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: docs/graphql-schema-sync
          base: user-guides-pub
          title: 'docs: sync GraphQL schema reference'
          commit-message: 'docs: regenerate GraphQL schema reference from the published SDL'
          body: |
            The OMS GraphQL schema changed. This regenerates
            `documents/integrate-with-hotwax/api/graphql/schema-reference.md` from the SDL published
            at `/rest/s1/graphql/sdl`.

            Generated by the `graphql-schema-sync` workflow. Review the diff for new objects, edges,
            search keys, or sort keys that also deserve prose in the surrounding pages.
          add-paths: |
            documents/integrate-with-hotwax/api/graphql/schema-reference.md
          delete-branch: true
