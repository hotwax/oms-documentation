name: Publish Monthly Content

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      month:
        description: "Target month in YYYY-MM format"
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Resolve base branch
        id: base
        run: |
          BASE_BRANCH="${{ vars.AUTOMATION_BASE_BRANCH }}"
          if [ -z "$BASE_BRANCH" ]; then
            BASE_BRANCH="multi-agent-product-update-pub"
          fi
          echo "base_branch=$BASE_BRANCH" >> "$GITHUB_OUTPUT"

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || steps.base.outputs.base_branch }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve source repos
        id: source-repos
        run: |
          SOURCE_REPOS="${{ vars.SOURCE_REPOS }}"
          if [ -z "$SOURCE_REPOS" ]; then
            SOURCE_REPOS="hotwax/receiving,hotwax/bopis,hotwax/fulfillment,hotwax/inventory-count,hotwax/transfers,hotwax/facilities,hotwax/preorder,hotwax/oms"
          fi
          echo "source_repos=$SOURCE_REPOS" >> "$GITHUB_OUTPUT"

      - name: Validate publish trigger
        id: guard
        run: |
          SHOULD_PUBLISH="true"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            MONTHLY_PREFIX="$(node -e "console.log(JSON.parse(require('fs').readFileSync('config/publishing.json', 'utf8')).automation.monthlyBranchPrefix)")"
            REPLAY_PREFIX="$(node -e "console.log(JSON.parse(require('fs').readFileSync('config/publishing.json', 'utf8')).automation.replayBranchPrefix)")"
            if [ "${{ github.event.pull_request.base.ref }}" != "${{ steps.base.outputs.base_branch }}" ]; then
              SHOULD_PUBLISH="false"
            fi
            case "${{ github.event.pull_request.head.ref }}" in
              "$MONTHLY_PREFIX"*) ;;
              "$REPLAY_PREFIX"*) ;;
              *) SHOULD_PUBLISH="false" ;;
            esac
          fi
          echo "should_publish=$SHOULD_PUBLISH" >> "$GITHUB_OUTPUT"

      - name: Resolve manifest path
        id: manifest
        if: steps.guard.outputs.should_publish == 'true'
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MONTH="${{ inputs.month }}"
            MANIFEST_PATH="drafts/${MONTH}/publish-manifest.json"
          else
            MANIFEST_PATH="$(git diff-tree --no-commit-id --name-only -r "${{ github.event.pull_request.merge_commit_sha }}" | grep 'drafts/.*/publish-manifest.json' | head -n 1)"
            if [ -z "$MANIFEST_PATH" ]; then
              echo "No publish manifest found in merged PR."
              exit 1
            fi
            MONTH="$(node -e "console.log(JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8')).month)" "$MANIFEST_PATH")"
          fi
          echo "manifest_path=$MANIFEST_PATH" >> "$GITHUB_OUTPUT"
          echo "month=$MONTH" >> "$GITHUB_OUTPUT"

      - name: Validate publish manifest
        if: steps.guard.outputs.should_publish == 'true'
        env:
          MANIFEST_PATH: ${{ steps.manifest.outputs.manifest_path }}
        run: |
          npm run validate:manifest
          npm run validate:state

      - name: Publish to HubSpot
        id: publish
        if: steps.guard.outputs.should_publish == 'true'
        continue-on-error: true
        env:
          MANIFEST_PATH: ${{ steps.manifest.outputs.manifest_path }}
          HUBSPOT_PRIVATE_APP_TOKEN: ${{ secrets.HUBSPOT_PRIVATE_APP_TOKEN }}
          PRODUCTION: "true"
          SOURCE_REPOS: ${{ steps.source-repos.outputs.source_repos }}
        run: npm run publish:monthly

      - name: Commit sync state updates
        if: steps.guard.outputs.should_publish == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/hubspot-sync-state.json
          if git diff --cached --quiet; then
            echo "No sync state changes to commit."
            exit 0
          fi
          git commit -m "chore(sync): update HubSpot state for ${{ steps.manifest.outputs.month }}"
          git push origin HEAD:${{ steps.base.outputs.base_branch }}

      - name: Fail if publish failed
        if: steps.guard.outputs.should_publish == 'true' && steps.publish.outcome == 'failure'
        run: exit 1
