name: Publish Monthly Content

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      month:
        description: "Target month in YYYY-MM format"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  publish:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Resolve base branch
        id: base
        run: |
          BASE_BRANCH="${{ vars.AUTOMATION_BASE_BRANCH }}"
          if [ -z "$BASE_BRANCH" ]; then
            BASE_BRANCH="multi-agent-product-update-pub"
          fi
          echo "base_branch=$BASE_BRANCH" >> "$GITHUB_OUTPUT"

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || steps.base.outputs.base_branch }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate publish trigger
        id: guard
        run: |
          SHOULD_PUBLISH="true"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            MONTHLY_PREFIX="$(node -e "console.log(JSON.parse(require('fs').readFileSync('config/publishing.json', 'utf8')).automation.monthlyBranchPrefix)")"
            REPLAY_PREFIX="$(node -e "console.log(JSON.parse(require('fs').readFileSync('config/publishing.json', 'utf8')).automation.replayBranchPrefix)")"
            if [ "${{ github.event.pull_request.base.ref }}" != "${{ steps.base.outputs.base_branch }}" ]; then
              SHOULD_PUBLISH="false"
            fi
            case "${{ github.event.pull_request.head.ref }}" in
              "$MONTHLY_PREFIX"*) ;;
              "$REPLAY_PREFIX"*) ;;
              *) SHOULD_PUBLISH="false" ;;
            esac
          fi
          echo "should_publish=$SHOULD_PUBLISH" >> "$GITHUB_OUTPUT"

      - name: Resolve manifest path
        id: manifest
        if: steps.guard.outputs.should_publish == 'true'
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MONTH="${{ inputs.month }}"
            MANIFEST_PATH="drafts/${MONTH}/publish-manifest.json"
          else
            MANIFEST_PATH="$(git diff-tree --no-commit-id --name-only -r -m "${{ github.event.pull_request.merge_commit_sha }}" | grep 'drafts/.*/publish-manifest.json' | head -n 1)"
            if [ -z "$MANIFEST_PATH" ]; then
              echo "No publish manifest found in merged PR."
              exit 1
            fi
            MONTH="$(node -e "console.log(JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8')).month)" "$MANIFEST_PATH")"
          fi
          echo "manifest_path=$MANIFEST_PATH" >> "$GITHUB_OUTPUT"
          echo "month=$MONTH" >> "$GITHUB_OUTPUT"

      - name: Validate publish manifest
        if: steps.guard.outputs.should_publish == 'true'
        env:
          MANIFEST_PATH: ${{ steps.manifest.outputs.manifest_path }}
        run: |
          npm run validate:manifest
          npm run validate:state

      - name: Publish to HubSpot
        id: publish
        if: steps.guard.outputs.should_publish == 'true'
        continue-on-error: true
        env:
          MANIFEST_PATH: ${{ steps.manifest.outputs.manifest_path }}
          HUBSPOT_PRIVATE_APP_TOKEN: ${{ secrets.HUBSPOT_PRIVATE_APP_TOKEN }}
          PRODUCTION: "true"
          SOURCE_REPOS: ${{ vars.SOURCE_REPOS }}
        run: npm run publish:monthly

      - name: Create or update sync state PR
        if: steps.guard.outputs.should_publish == 'true' && steps.publish.outcome == 'success' && steps.publish.outputs.release_notes_url != ''
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: ${{ steps.base.outputs.base_branch }}
          branch: automation/publish-sync-${{ steps.manifest.outputs.month }}
          commit-message: "chore(sync): update HubSpot state for ${{ steps.manifest.outputs.month }}"
          title: "chore(sync): update HubSpot publish state for ${{ steps.manifest.outputs.month }}"
          body: |
            Records the HubSpot publish status update for `${{ steps.manifest.outputs.month }}`.

            Published release notes:
            - [${{ steps.manifest.outputs.month }} release notes](${{ steps.publish.outputs.release_notes_url }})

            Merge instructions:
            - Merge this PR after confirming the published page looks correct.
            - Turn on "Delete branch" when merging so the automation branch does not need to be pruned later.
          labels: |
            automation
            publish-sync
          assignees: dt2patel

      - name: Fail if publish failed
        if: steps.guard.outputs.should_publish == 'true' && steps.publish.outcome == 'failure'
        run: exit 1
